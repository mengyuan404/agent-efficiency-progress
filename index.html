<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Agent-Efficiency · 研究进度</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f3f6fa;
      color: #182a42;
      font:
        16px/1.6 system-ui,
        sans-serif;
    }
    main {
      max-width: 1040px;
      margin: auto;
      padding: 38px 24px;
    }
    header {
      border-top: 5px solid #306c95;
      padding-top: 20px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: -0.04em;
    }
    h2 {
      font-size: 1.15rem;
      color: #214f73;
      margin: 0 0 12px;
    }
    p {
      margin: 0.5em 0;
    }
    section {
      background: white;
      border: 1px solid #cfdbe4;
      border-radius: 9px;
      padding: 20px;
      margin: 12px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(265px, 100%), 1fr));
      gap: 12px;
    }
    .grid section {
      margin: 0;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      padding: 5px 0;
      border-bottom: 1px solid #eef1f4;
    }
    .row span:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    #alert {
      color: #853d12;
    }
    small,
    footer {
      color: #495d72;
    }
    footer {
      overflow-wrap: anywhere;
      margin-top: 16px;
    }
    .stage {
      padding: 8px 0;
      border-bottom: 1px solid #eef1f4;
    }
    .stage b {
      display: block;
    }
    progress {
      width: 100%;
      accent-color: #33789d;
    }
  </style>
  <main>
    <header>
      <h1>Agent-Efficiency</h1>
      <p>在有限评测预算下，寻找兼顾任务成功率、费用和时延的智能体配置。</p>
    </header>
    <div id="alert" role="status"></div>
    <div id="content"></div>
    <footer id="source"></footer>
  </main>
  <script>
    const words = {
      rd_planning:"Codex 规划中",rd_awaiting_result:"等待实验结果",rd_awaiting_plan:"待研究规划",rd_queued:"任务已入队",rd_collection:"实验执行中",rd_analysis:"分析研究证据",rd_development:"开发中",rd_backoff:"等待退避",rd_waiting:"等待解除阻塞",rd_accepted:"研究目标已验收",rd_execute:"执行已冻结任务",rd_plan:"根据证据重新规划",

      prepare: "核对执行状态",
      environment: "验证 AppWorld 环境",
      provider: "核实模型目录与单价",
      key: "等待服务器配置 DeepInfra 凭据",
      smoke: "运行首个任务的 8 种配置",
      matrix: "配对采集与费用预测",
      compare: "比较四种搜索基线",
      review: "审阅阶段证据",
      budget: "评测预算不足",
      interrupted: "核查中断与预留费用",
      finished: "本次队列已完成",
      running: "实验运行中",
      working: "调度器工作中",
      blocked: "等待条件",
      stopped: "已停止",
      device_check: "待真机复核",
      verified: "已验收",
      active: "进行中",
      pending: "待开始", queued: "已排队", started: "已启动", completed: "已完成",
      backoff: "退避等待", failed: "失败", official_control: "官方参考解对照",
      cli_missing: "服务找不到 Codex", workspace_route: "工作区路由失败", authentication: "服务认证失败",
      network: "审阅网络连接失败", cli_exit: "Codex 调用失败", deadline: "超过调用时限",
      implementation: "后续任务执行异常", review_failure: "审阅输出或执行异常",
      encoding_control: "动作编码单步对照", replication: "独立发现任务复核", replication_analysis: "复核批次分析",
      pilot: "V2 发现集验证", analysis: "发现集诊断与搜索比较", hold: "审阅要求暂停",
      control_failed: "参考解对照失败", signal: "缺少模型整题成功样本",
    };
    const milestones = {
      history: "仓库历史已核验",
      budget: "累计预算保护已验证",
      resume: "断点恢复已验证",
      provider: "两款模型目录已核验",
      environment: "官方环境已验证",
      tests: "软件契约检查已通过",
      dashboard: "公网读回已验证",
      plan: "192 个采集单元已固定",
      recovery54: "第 55 个单元已在限流中断后完成评分，原计费预留继续计入预算",
    };
    const titles = [
      "可恢复运行与公网面板",
      "官方环境与真实冒烟",
      "搜索空间与代表性基线",
      "原创方法与消融",
      "泛化与论文材料",
    ];
    const exits = [
      "外网可读，停机过期、重启及累计费用可核查",
      "8 个配置可追踪至官方评分或预算受限的部分证据",
      "真实配对矩阵、交互估计和同预算比较",
      "方法差异及模块贡献有可复现证据",
      "跨场景验证、复现材料及结论边界",
    ];
    const ui = (tag, text, parent, cls) => {
      let e = document.createElement(tag);
      if (text != null) e.textContent = text;
      if (cls) e.className = cls;
      parent.append(e);
      return e;
    };
    const stamp = (x) =>
      x ? new Date(x).toLocaleString("zh-CN", { hour12: false }) : "尚无记录";
    let last,
      problem = false;
    function draw() {
      let root = document.querySelector("#content"),
        warn = document.querySelector("#alert");
      root.replaceChildren();
      if (!last) {
        warn.textContent = problem
          ? "读取进度失败，等待重试。"
          : "正在读取研究进度…";
        return;
      }
      const d = last,
        old = (x) => !x || Date.now() - Date.parse(x) > 300000,
        stale = old(d.generated_at);
      warn.textContent = [
        problem ? "读取失败，保留上次数据。" : "",
        stale ? "数据超过 5 分钟未更新，当前活动未知。" : "",
      ].join(" ");
      const sec = (p, t) => {
        let s = ui("section", null, p);
        ui("h2", t, s);
        return s;
      };
      const row = (s, k, v) => {
        let r = ui("div", null, s, "row");
        ui("span", k, r);
        ui("span", v ?? "暂无数据", r);
      };
      let overview = sec(root, "当前研究状态");
      row(
        overview,
        "阶段",
        d.current_stage + " · " + titles[Number(d.current_stage[1])],
      );
      row(
        overview,
        "执行状态",
        stale
          ? "数据过期"
          : (d.execution_status === "running" &&
                old(d.experiment_heartbeat_at)) ||
              (d.execution_status === "working" && [d.worker_heartbeat_at,d.followup?.review_heartbeat_at,d.followup?.development_heartbeat_at,d.research?.planning_at,d.research?.task_at].every(old))
            ? "心跳过期"
            : words[d.execution_status],
      );
      row(overview, "当前动作", words[d.current_action]);
      row(overview, "下一项", words[d.next_action]);
      for (let b of d.blockers) row(overview, "阻塞", words[b]);
      if (d.research) {
        const r=d.research, section=sec(root,"目标驱动的研发");
        const names={source:"核实官方普通 agent 与提示来源",control:"普通 agent 整题对照",contrast:"单因素配对对照",matrix:"三维空间配对采集",search:"同预算强基线重放",method:"改进候选方法与消融",synthesis:"评估路线与证据缺口",diagnosis:"故障与部分结果分析",validation:"新场景独立验证",validation_search:"冻结方法外部检验",redesign:"替代研究假设",interaction:"配对交互分析"};
        const why={source_integrity:"参考解使用特权信息",low_success:"历史普通模型整题成功稀少",independent_control:"检验其他模型或场景是否复现",matched_model:"原模型整题全零，已有单因素实测；固定任务与普通协议，更换基础模型",quality_signal:"质量出现区分且干预触发",space_trigger:"检验信息与执行干预的实际触发",candidate_uncertainty:"结构共享的优势尚不确定",transfer_uncertainty:"跨任务可重复性不足",resource_review:"核对阻塞与剩余证据",normal_quality_uncertain:"普通执行质量仍不确定",observed_unfence:"单段代码围栏",observed_output:"输出达到长度限制",observed_docs:"文档或参数调用错误",observed_auth:"应用鉴权错误",observed_completion:"提交与评分不符",observed_stop:"错误后继续执行",fresh_evidence:"需要未参与开发的独立场景",method_replication:"检验冻结方法的复现性",interaction_precision:"估计三维配对交互"};
        const tests={source:"官方提示可依靠公开字段初始化",control:"固定发现任务中至少一题官方通过",contrast:"单一改动使配对整题通过数增加",matrix:"八个配置可评分且两个策略维度均触发",search:"同预算下优于强基线",method:"改进同时优于父方法和强基线",validation:"独立场景支持既有质量和成本结论",validation_search:"冻结策略在新场景维持优势",interaction:"配对交互跨任务一致",synthesis:"证据可区分竞争路线",diagnosis:"能从账本和断点定位阻塞"};
        const conclusions={verified:"实现验收通过",invalid:"实现验证失败",pilot_supported:"本轮探索性结果支持假设",not_supported:"本轮假设未获支持",measured:"实验测量完成",analyzed:"分析已完成",accepted:"验收条件已核实"};
        const goals={normal_control:"普通 agent 对照",usable_agent:"可用的整题成功率",space_validation:"三维交互与触发",method_effect:"方法优势",generalization:"独立泛化"};
        const blocks={budget:"基础模型剩余预算不足",billing:"请求计费待核",execution_failure:"连续执行失败，检查根因",direction_decision:"需要选择新的研究路线",credential:"服务凭据缺失",resource:"执行资源不可用",planner_failure:"Codex 规划连续失败，已达尝试上限"};
        row(section,"未达到的目标",r.unmet.map(x=>goals[x]).join("、") || "全部已验收");
        row(section,"任务",names[r.task] || words["rd_"+r.phase]);
        const shortId=id=>id?.slice(0,12);
        if(r.phase==="collection" || r.phase==="awaiting_result") row(section,"规划器","等待实验结果");
        if(["budget","billing","resource","credential","planner_failure"].includes(r.blocker)) row(section,"资源阻塞",blocks[r.blocker]);
        const call=r.last_call;
        if(call){
          const verdict={running:"调用中",succeeded:"成功",failed:"失败"};
          row(section,"最近真实 Codex 规划",stamp(call.started)+" · "+verdict[call.outcome]+(call.ended?" · "+stamp(call.ended): ""));
          if(call.parent) row(section,"规划依据任务",shortId(call.parent));
          if(call.task) row(section,"该次规划选定的任务",names[call.kind]+" · "+shortId(call.task));
        }
        if (r.hypothesis) row(section,"检验条件",r.reason==="matched_model"?"只更换基础模型后，同任务整题通过数增加":r.hypothesis==="contrast" && r.reason==="observed_stop"?"允许错误后继续执行能提高配对整题通过数":tests[r.hypothesis]);
        if (r.reason) row(section,"依据",why[r.reason]+(r.trigger===null?"":" · "+r.trigger+" 次"));
        if (r.latest) row(section,"最近产物",names[r.latest]+" · "+conclusions[r.outcome]);
        row(section,"最近模型实验 · 整题成功",r.success+" / "+r.n);
        row(section,"方法有效性",r.method_supported?"已获对照支持":"尚未获得足够支持");
        row(section,"已评分新轨迹 / 已审查轮次",r.cells_done+" / "+r.rounds);
        row(section,"Codex 规划调用尝试",r.codex_attempts+" · 与基础模型账本分列");
        row(section,"本任务尝试 / 上限",r.attempts+" / "+r.limit);
        if(r.retry_at) row(section,"最早重试",stamp(r.retry_at));
        if(r.blocker) row(section,"阻塞",blocks[r.blocker]);
        for(const [k,t,live] of [["规划",r.planning_at,r.planning_live],["执行",r.task_at,r.task_live]])
          row(section,k+"心跳",(stale?"面板数据过期":live?(old(t)?"过期":"活动"):t && old(t)?"空闲，上次心跳已过期":"空闲")+" · "+stamp(t));
      }
      let g = ui("div", null, root, "grid"),
        c = sec(g, "原实验 V1"),
        b = sec(g, "项目累计预算 · USD");
      let count = d.trajectory_counts;
      row(c, "完整轨迹", count.completed + " / " + count.planned);
      let p = ui("progress", null, c);
      p.max = count.planned;
      p.value = count.completed;
      p.setAttribute("aria-label", "完整轨迹");
      row(b, "全项目请求记录", count.calls);
      row(
        c,
        "项目采集进程",
        stale
          ? "未知"
          : d.experiment_active && !old(d.experiment_heartbeat_at)
            ? "1"
            : "0",
      );
      if (d.current_unit) row(c, "单元标识", d.current_unit);
      for (let [k, t] of Object.entries({
        authorized_usd: "授权上限",
        confirmed_or_estimated_usd: "按用量估计",
        unknown_billing_usd: "历史未知计费预留",
        pending_usd: "待结算请求预留",
        available_usd: "可用余额",
      }))
        row(b, t, d.budget[k]?.toFixed(6));
      if (d.followup) {
        const f = d.followup, s = sec(root,"审阅与后续研究");
        row(s,"Codex 审阅",words[f.review_status] + " · " + f.review_attempts + " 次尝试");
        row(s,words[f.task],words[f.task_status] + " · " + f.task_attempts + " 次尝试");
        if (f.block_reason) row(s,"阻塞原因",words[f.block_reason]);
        if (f.paid_pause) row(s,"付费调用暂停",f.paid_pause==="budget"?"下一笔预留超出预算":"接口或计费待核查");
        if (f.retry_at) row(s,"最早重试",stamp(f.retry_at));
        row(s,"官方参考解 · 整题通过",f.reference_success + " / " + f.reference_n);
        row(s,"V2 独立发现集 · 已评分",f.pilot_n + " / " + f.pilot_planned);
        row(s,"V2 模型 · 整题通过",f.pilot_success + " / " + f.pilot_n);
        if (f.replication_planned) {
          row(s,"独立复核 · 已评分",f.replication_n + " / " + f.replication_planned);
          row(s,"独立复核 · 整题通过",f.replication_success + " / " + f.replication_n);
        }
        if (f.search?.length) {
          const search = sec(root,"发现任务搜索重放 · 75% 揭示预算");
          for (const v of f.search) row(search, words[v.batch] + " · " + v.method,
            "可负担 " + v.feasible + "/5 种子 · 相对 HV regret " + (v.regret?.toFixed(3) ?? "无定义") +
            " · 前沿召回 " + (v.recall?.toFixed(2) ?? "无定义"));
        }
      }
      let m = sec(root, "V1 发现集效果与干预");
      for (let [k, t] of Object.entries({
        n: "完整样本",
        success_rate: "官方成功率",
        latency_median_s: "任务时延中位数（秒）",
        input_tokens: "输入 Token",
        output_tokens: "输出 Token",
        masked_observation_exposures: "遮盖观测呈现次数",
        errors: "动作与工具错误",
        repair_steps: "出错后继续执行次数",
        recovery_calls: "回查原文次数",
      }))
        row(
          m,
          t,
          k === "success_rate" && d.metrics[k] != null
            ? (d.metrics[k] * 100).toFixed(1) + "%"
            : d.metrics[k],
        );
      let phases = sec(root, "阶段与验收条件");
      titles.forEach((t, i) => {
        let e = ui("div", null, phases, "stage");
        ui("b", "P" + i + " · " + t + " · " + words[d.stages[i]], e);
        ui("small", exits[i], e);
      });
      let methods = sec(root, "Pareto 前沿与基线");
      ui(
        "p",
        "CC-Gittins、按费用归一化的 qNEHVI 与 qLogNEHVI、随机搜索。配置按同一预热和揭示预算比较。",
        methods,
      );
      if (d.pareto?.length) {
        for (const x of d.pareto)
          row(
            methods,
            "配置 " + x.arm + " · n=" + x.n,
            (x.quality * 100).toFixed(1) +
              "% · " +
              x.seconds.toFixed(1) +
              " 秒 · $" +
              x.usd.toFixed(6),
          );
      } else ui("p", "发现集配对矩阵尚未收齐，暂无实测前沿。", methods);
      if (d.baseline?.length) {
        for (const x of d.baseline)
          row(
            methods,
            x.method + " · " + 100 * x.fraction + "% 预算",
            "HV regret " +
              x.regret.toFixed(3) +
              " · 召回 " +
              x.recall.toFixed(2) +
              " · " +
              x.seeds +
              " 个种子",
          );
      } else ui("p", "V1 全部质量为零时，参考超体积为零，相对 HV regret 无定义。", methods);
      let proof = sec(root, "证据与心跳");
      for (let x of d.recent_events) ui("div", milestones[x], proof);
      for (let [t, at, live] of [
        ["调度器", d.worker_heartbeat_at, d.worker_active],
        ["审阅进程", d.followup?.review_heartbeat_at, d.followup?.review_active],
        ["开发进程", d.followup?.development_heartbeat_at, d.followup?.development_active],
        ["实验进程", d.experiment_heartbeat_at, d.experiment_active],
      ])
        row(
          proof,
          t,
          (live && at && old(at)
            ? "心跳过期"
            : live
              ? "活动"
              : at
                ? "已停止"
                : "尚未运行") +
            " · " +
            stamp(at),
        );
      document.querySelector("#source").textContent =
        "来源：服务器账本与官方轨迹索引 · " +
        stamp(d.generated_at) +
        " · Git " +
        d.code_revision;
    }
    async function refresh() {
      try {
        let r = await fetch(
          "https://api.github.com/repos/mengyuan404/agent-efficiency-progress/releases/tags/progress",
          { cache: "no-store", signal: AbortSignal.timeout(15000) },
        );
        if (!r.ok) throw Error();
        last = JSON.parse((await r.json()).body);
        problem = false;
      } catch {
        problem = true;
      }
      draw();
    }
    draw();
    refresh();
    setInterval(refresh, 60000);
    setInterval(draw, 10000);
  </script>
</html>
